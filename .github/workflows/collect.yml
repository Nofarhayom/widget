name: איסוף נתוני בחירות

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install requests feedparser cloudscraper pytrends

      - name: Collect data
        run: python collector.py

      - name: Commit & push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet \
            && echo "No changes" \
            || (git commit -m "data: עדכון נתוני בחירות $(date +'%d/%m/%Y %H:%M')" && git push)
